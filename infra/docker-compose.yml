# Bhumi-Raksha AI — local development stack
# Services: db (PostGIS) · api (FastAPI) · minio (S3-compatible object store)
#
# Usage:
#   docker compose -f infra/docker-compose.yml up -d db minio   # infra only
#   docker compose -f infra/docker-compose.yml up --build       # + api
#
# Credentials below are LOCAL DEV DEFAULTS (overridable via shell env / .env).
# Do not reuse them in any real deployment (project rule §14).

name: bhumi-raksha

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bhumi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bhumi}
      POSTGRES_DB: ${POSTGRES_DB:-bhumi_raksha}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bhumi} -d ${POSTGRES_DB:-bhumi_raksha}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - miniodata:/data

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # api talks to the db/minio services over the compose network
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bhumi}:${POSTGRES_PASSWORD:-bhumi}@db:5432/${POSTGRES_DB:-bhumi_raksha}
      WEATHER_PROVIDER: ${WEATHER_PROVIDER:-mock}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-bhumi-media}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  pgdata:
  miniodata:
